services:
  - type: web
    name: denada-ops
    runtime: node
    plan: starter
    # Custom domain — add a CNAME record at your DNS provider pointing
    # ops.denadatequila.com to this service's onrender.com hostname, and
    # Render provisions TLS automatically.
    domains:
      - ops.denadatequila.com
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run deploy:start
    disk:
      name: denada-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: file:/data/denada.db
      - key: AUTH_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
