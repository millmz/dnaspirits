services:
  - type: web
    name: denada-ops
    runtime: node
    plan: starter
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run deploy:start
    disk:
      name: denada-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: file:/data/denada.db
      - key: AUTH_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
